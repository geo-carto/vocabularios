---
# see https://github.com/nextapps-de/flexsearch#tokenizer-prefix-search for options
tokenizer: "full" # strict, forward, reverse, full
custom_domain: "https://geo-carto.github.io/vocabularios/"
fail_on_validation: false
searchableAttributes:
  - "prefLabel" # you should not delete this one
  - "notation"
  - "altLabel"
  - "hiddenLabel"
  - "example"
  - "definition"
ui:
  title: "Repositorio de Vocabularios" # Title is mandatory
  logo: "logo.png" # Path
  colors:
    skoHubWhite: "rgb(255, 255, 255)"
    skoHubDarkColor: "rgb(35, 15, 5)"
    skoHubMiddleColor: "rgb(140, 90, 50)"
    skoHubLightColor: "rgb(235, 215, 190)"
    skoHubThinColor: "rgb(248, 242, 232)"
    skoHubBlackColor: "rgb(20, 10, 0)"
    skoHubAction: "rgb(196, 95, 40)"
    skoHubNotice: "rgb(45, 140, 80)"
    skoHubDarkGrey: "rgb(130, 110, 90)"
    skoHubMiddleGrey: "rgb(195, 180, 160)"
    skoHubLightGrey: "rgb(245, 240, 232)"
  fonts:
    regular:
      font_family: "roboto"
      font_style: "normal"
      font_weight: 400
      name: "roboto-regular"
    bold:
      font_family: "roboto"
      font_style: "normal"
      font_weight: 700
      name: "special-gothic-condensed-one-regular"
  footer:
    links:
      - title: "IGME-CSIC"
        url: "https://www.igme.es"
        target: "_blank"
        rel: "noopener noreferrer"
      - title: "Contacto"
        url: "mailto:vocabularios.cientificos@igme.es"
        target: "_blank"
        rel: "noopener noreferrer"
  home:
    subtitle: "Vocabularios SKOS para compartir conocimiento geológico científico"
    subtitle_en: "SKOS Vocabularies for sharing geological scientific knowledge"
    description: "Recursos semánticos en formato SKOS para describir, organizar y relacionar conceptos de forma estandarizada. Su estructura semántica favorece la interoperabilidad, mejora la búsqueda y la reutilización de la información, y facilita compartir conocimiento científico de manera coherente y reutilizable entre personas, sistemas y aplicaciones."
    description_en: "Semantic resources in SKOS format to describe, organize and relate concepts in a standardized way. Their semantic structure promotes interoperability, improves search and information reuse, and facilitates sharing scientific knowledge in a coherent and reusable way between people, systems and applications."
    ultima_actualizacion: "20 may 2024"
